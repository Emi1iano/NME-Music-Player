name: nme
description: NME music player - Windows desktop client
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  ffi: ^2.2.0
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9
  shared_preferences: ^2.5.5
  # Add later, when you wire up real playback / networking:
  # just_audio: ^0.9.40        -> local audio playback
  # web_socket_channel: ^2.4.5 -> talking to your Zig sync server
  # http: ^1.2.1               -> REST calls to your Zig server

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
